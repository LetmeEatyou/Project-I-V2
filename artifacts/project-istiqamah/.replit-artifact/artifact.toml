kind = "mobile"
previewPath = "/"
title = "Project Istiqamah"
description = "A private daily discipline app for building a consistent life through customizable tasks, focused time blocks, completion history, and device-aware focus settings."
version = "1.0.0"
id = "artifacts/project-istiqamah"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25352

[services.development]
run = "pnpm --filter @workspace/project-istiqamah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/project-istiqamah", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/project-istiqamah", "run", "serve" ]

[services.env]
PORT = "25352"
BASE_PATH = "/"
