name: Build Project Istiqamah iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    name: Build signed iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: pod install

      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install ad hoc provisioning profile
        id: provisioning
        env:
          PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_path="$profile_dir/project-istiqamah.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$profile_path"
          echo "uuid=$(security cms -D -i "$profile_path" | plutil -extract UUID raw -)" >> "$GITHUB_OUTPUT"
          echo "name=$(security cms -D -i "$profile_path" | plutil -extract Name raw -)" >> "$GITHUB_OUTPUT"

      - name: Archive the iOS app
        working-directory: artifacts/project-istiqamah
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.provisioning.outputs.uuid }}
          BUNDLE_ID: com.projectistiqamah.app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            clean archive

      - name: Create ad hoc export options
        working-directory: artifacts/project-istiqamah
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.provisioning.outputs.name }}
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.projectistiqamah.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -exportPath "$PWD/build/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios
          path: artifacts/project-istiqamah/build/export/*.ipa
          if-no-files-found: error