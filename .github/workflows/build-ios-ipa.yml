name: Build Project Istiqamah iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Select modern Xcode / Swift
      # --------------------------------------------------
      - name: Select Xcode 26.6
        run: |
          set -euo pipefail

          sudo xcode-select -s /Applications/Xcode_26.6.app

          echo "Xcode:"
          xcodebuild -version

          echo "Swift:"
          swift --version

          echo "Developer directory:"
          xcode-select -p

      # --------------------------------------------------
      # Node
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --------------------------------------------------
      # pnpm
      # --------------------------------------------------
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      # --------------------------------------------------
      # Install dependencies
      #
      # IMPORTANT:
      # We intentionally do NOT use --frozen-lockfile
      # because your current lockfile has an overrides
      # configuration mismatch.
      # --------------------------------------------------
      - name: Install JavaScript dependencies
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      # --------------------------------------------------
      # Generate native iOS project
      # --------------------------------------------------
      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

      # --------------------------------------------------
      # Install CocoaPods
      # --------------------------------------------------
      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: |
          set -euo pipefail

          pod install

      # --------------------------------------------------
      # Verify native toolchain before archive
      # --------------------------------------------------
      - name: Verify iOS build environment
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          echo "======================================"
          echo "XCODE"
          echo "======================================"
          xcodebuild -version

          echo "======================================"
          echo "SWIFT"
          echo "======================================"
          swift --version

          echo "======================================"
          echo "COCOAPODS"
          echo "======================================"
          pod --version

          echo "======================================"
          echo "NODE"
          echo "======================================"
          node --version

          echo "======================================"
          echo "PNPM"
          echo "======================================"
          pnpm --version

          echo "======================================"
          echo "EXPO"
          echo "======================================"
          pnpm exec expo --version

      # --------------------------------------------------
      # Archive
      #
      # NO signing certificates.
      # NO provisioning profile.
      # This creates an unsigned archive.
      # --------------------------------------------------
      - name: Archive unsigned iOS app
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build

          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      # --------------------------------------------------
      # Package unsigned .app into IPA-like archive
      #
      # This is NOT a signed installable IPA.
      # Signing will be handled later through your
      # SideStore / Apple developer account workflow.
      # --------------------------------------------------
      - name: Package unsigned app
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="$PWD/build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: ProjectIstiqamah.app was not found."
            echo "Archive contents:"
            find "$PWD/build/ProjectIstiqamah.xcarchive" -maxdepth 5 -print
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build

          zip -r ProjectIstiqamah-unsigned.ipa Payload

      # --------------------------------------------------
      # Upload archive
      # --------------------------------------------------
      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: |
            artifacts/project-istiqamah/build/ProjectIstiqamah.xcarchive
            artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error
          retention-days: 7