name: Build Project Istiqamah iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: pod install

      - name: Archive the iOS app
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Create unsigned IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          rm -rf build/unsigned-payload
          mkdir -p build/unsigned-payload

          cp -R \
            build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app \
            build/unsigned-payload/

          cd build/unsigned-payload
          zip -r ../ProjectIstiqamah-unsigned.ipa ProjectIstiqamah.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error