name: Build Project Istiqamah iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # pnpm
      # ---------------------------------------------------------
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      # ---------------------------------------------------------
      # Node
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ---------------------------------------------------------
      # Install dependencies
      #
      # IMPORTANT:
      # We intentionally allow pnpm to update the lockfile because
      # package.json contains new Expo overrides.
      # ---------------------------------------------------------
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      # ---------------------------------------------------------
      # Verify Expo dependency versions
      # ---------------------------------------------------------
      - name: Verify Expo module versions
        run: |
          set -euo pipefail

          echo "========================================"
          echo "expo-modules-jsi"
          echo "========================================"
          pnpm why expo-modules-jsi

          echo ""
          echo "========================================"
          echo "expo-modules-core"
          echo "========================================"
          pnpm why expo-modules-core

          echo ""
          echo "========================================"
          echo "expo"
          echo "========================================"
          pnpm why expo

      # ---------------------------------------------------------
      # Verify Xcode
      # ---------------------------------------------------------
      - name: Check Xcode version
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE VERSION"
          echo "========================================"

          xcodebuild -version

          echo ""
          echo "Developer directory:"
          xcode-select -p

      # ---------------------------------------------------------
      # Expo prebuild
      # ---------------------------------------------------------
      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

      # ---------------------------------------------------------
      # CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: |
          set -euo pipefail

          pod install

      # ---------------------------------------------------------
      # Verify workspace
      # ---------------------------------------------------------
      - name: Verify iOS workspace
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          if [ ! -d "ios/ProjectIstiqamah.xcworkspace" ]; then
            echo "ERROR: ProjectIstiqamah.xcworkspace was not created."
            exit 1
          fi

          echo "Workspace found:"
          ls -la ios/ProjectIstiqamah.xcworkspace

      # ---------------------------------------------------------
      # Archive
      #
      # NO Apple certificate
      # NO provisioning profile
      # NO signing secrets
      #
      # This is intentionally an unsigned test build.
      # ---------------------------------------------------------
      - name: Archive unsigned iOS app
        working-directory: artifacts/project-istiqamah
        run: |
          set -uo pipefail

          mkdir -p build

          LOG_FILE="$PWD/build/xcodebuild.log"

          echo "========================================"
          echo "STARTING XCODE ARCHIVE"
          echo "========================================"

          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive \
            2>&1 | tee "$LOG_FILE"

          XCODE_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "XCODE BUILD RESULT"
          echo "========================================"

          if [ "$XCODE_EXIT" -ne 0 ]; then
            echo "Xcode exited with code: $XCODE_EXIT"
            echo ""

            echo "========================================"
            echo "ACTUAL ERROR LINES"
            echo "========================================"

            grep -n -E \
              "error:|fatal error:|BUILD FAILED|Command .* failed" \
              "$LOG_FILE" | tail -100 || true

            echo ""
            echo "========================================"
            echo "FAILED BUILD COMMANDS"
            echo "========================================"

            grep -n \
              "The following build commands failed:" \
              "$LOG_FILE" -A40 || true

            echo ""
            echo "========================================"
            echo "LAST 150 LOG LINES"
            echo "========================================"

            tail -150 "$LOG_FILE"

            exit "$XCODE_EXIT"
          fi

          echo "Xcode archive succeeded."

      # ---------------------------------------------------------
      # Verify archive
      # ---------------------------------------------------------
      - name: Verify archive
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Archive completed but app was not found."

            echo ""
            echo "Archive contents:"
            find build/ProjectIstiqamah.xcarchive \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "========================================"
          echo "ARCHIVE SUCCESS"
          echo "========================================"
          echo "App:"
          echo "$APP_PATH"

      # ---------------------------------------------------------
      # Create unsigned IPA
      # ---------------------------------------------------------
      - name: Create unsigned IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app"

          rm -rf build/unsigned-payload
          rm -f build/ProjectIstiqamah-unsigned.ipa

          mkdir -p build/unsigned-payload

          cp -R \
            "$APP_PATH" \
            build/unsigned-payload/ProjectIstiqamah.app

          cd build/unsigned-payload

          zip -r \
            ../ProjectIstiqamah-unsigned.ipa \
            ProjectIstiqamah.app

      # ---------------------------------------------------------
      # Verify IPA
      # ---------------------------------------------------------
      - name: Verify IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          IPA="build/ProjectIstiqamah-unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "========================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh "$IPA"

      # ---------------------------------------------------------
      # Upload IPA
      # ---------------------------------------------------------
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error

      # ---------------------------------------------------------
      # Upload Xcode log too
      #
      # If archive fails, you'll be able to download the complete
      # log instead of searching through GitHub's huge log.
      # ---------------------------------------------------------
      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-xcode-build-log
          path: artifacts/project-istiqamah/build/xcodebuild.log
          if-no-files-found: ignore