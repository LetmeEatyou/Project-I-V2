name: Build Project Istiqamah iOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Verify tool versions
        run: |
          node --version
          pnpm --version
          xcodebuild -version
          swift --version

      - name: Install JavaScript dependencies
        run: pnpm install -no--frozen-lockfile

      - name: Verify Expo dependency versions
        working-directory: artifacts/project-istiqamah
        run: |
          pnpm exec expo --version
          pnpm list expo react-native @expo/ui expo-modules-core --depth 0 || true

      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: |
          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: |
          pod install --repo-update

      - name: Build unsigned iOS app
        working-directory: artifacts/project-istiqamah
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate built app
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="$(find build/DerivedData/Build/Products -type d -name 'ProjectIstiqamah.app' | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ProjectIstiqamah.app was not found."
            find build/DerivedData/Build/Products -maxdepth 5 -type d | head -n 100
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p build/unsigned
          cp -R "$APP_PATH" build/unsigned/ProjectIstiqamah.app

      - name: Create unsigned IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R build/unsigned/ProjectIstiqamah.app build/Payload/

          cd build
          zip -qry ProjectIstiqamah-unsigned.ipa Payload

          echo "Created:"
          ls -lh ProjectIstiqamah-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error