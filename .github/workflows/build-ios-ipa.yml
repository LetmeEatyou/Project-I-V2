name: Build Project Istiqamah iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up pnpm FIRST
      # ---------------------------------------------------------
      # This must come before setup-node's pnpm cache.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      # ---------------------------------------------------------
      # 3. Set up Node
      # ---------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ---------------------------------------------------------
      # 4. Install dependencies
      # ---------------------------------------------------------
      # We intentionally do NOT use --frozen-lockfile.
      #
      # package.json contains pnpm overrides for:
      #   expo-modules-jsi = 57.0.4
      #   expo-modules-core = 57.0.11
      #
      # The existing lockfile was created before those overrides,
      # so pnpm must be allowed to update it.
      # ---------------------------------------------------------
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      # ---------------------------------------------------------
      # 5. Verify the actual resolved versions
      # ---------------------------------------------------------
      # This is important. If ExpoModulesJSI fails again,
      # we will know whether the override was actually applied.
      # ---------------------------------------------------------
      - name: Verify Expo module versions
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Expo Modules JSI"
          echo "========================================"
          pnpm why expo-modules-jsi

          echo ""
          echo "========================================"
          echo "Expo Modules Core"
          echo "========================================"
          pnpm why expo-modules-core

          echo ""
          echo "========================================"
          echo "Expo"
          echo "========================================"
          pnpm why expo

      # ---------------------------------------------------------
      # 6. Show Xcode version
      # ---------------------------------------------------------
      - name: Check Xcode version
        run: |
          set -euo pipefail

          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "Selected developer directory:"
          xcode-select -p

      # ---------------------------------------------------------
      # 7. Generate native iOS project
      # ---------------------------------------------------------
      - name: Generate native iOS project
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

      # ---------------------------------------------------------
      # 8. Install CocoaPods
      # ---------------------------------------------------------
      - name: Install CocoaPods
        working-directory: artifacts/project-istiqamah/ios
        run: |
          set -euo pipefail

          pod install

      # ---------------------------------------------------------
      # 9. Verify workspace exists
      # ---------------------------------------------------------
      - name: Verify iOS workspace
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          if [ ! -d "ios/ProjectIstiqamah.xcworkspace" ]; then
            echo "ERROR: ProjectIstiqamah.xcworkspace was not created."
            exit 1
          fi

          echo "iOS workspace found:"
          ls -la ios/ProjectIstiqamah.xcworkspace

      # ---------------------------------------------------------
      # 10. Archive WITHOUT Apple signing
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      # No Apple certificate.
      # No provisioning profile.
      # No Apple Developer secrets.
      #
      # This is only an unsigned test archive.
      #
      # SideStore / free Developer Account signing will be handled
      # later.
      # ---------------------------------------------------------
      - name: Archive unsigned iOS app
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild \
            -workspace ios/ProjectIstiqamah.xcworkspace \
            -scheme ProjectIstiqamah \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ProjectIstiqamah.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      # ---------------------------------------------------------
      # 11. Verify archive
      # ---------------------------------------------------------
      - name: Verify archive
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Archive completed but ProjectIstiqamah.app was not found."
            echo ""
            echo "Archive contents:"
            find build/ProjectIstiqamah.xcarchive -maxdepth 5 -print
            exit 1
          fi

          echo "Archive created successfully."
          echo "App found at:"
          echo "$APP_PATH"

      # ---------------------------------------------------------
      # 12. Create unsigned IPA
      # ---------------------------------------------------------
      #
      # An IPA is basically a ZIP containing the .app.
      #
      # We are NOT signing here.
      # ---------------------------------------------------------
      - name: Create unsigned IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          APP_PATH="build/ProjectIstiqamah.xcarchive/Products/Applications/ProjectIstiqamah.app"

          rm -rf build/unsigned-payload
          rm -f build/ProjectIstiqamah-unsigned.ipa

          mkdir -p build/unsigned-payload

          cp -R \
            "$APP_PATH" \
            build/unsigned-payload/ProjectIstiqamah.app

          cd build/unsigned-payload

          zip -r \
            ../ProjectIstiqamah-unsigned.ipa \
            ProjectIstiqamah.app

      # ---------------------------------------------------------
      # 13. Verify IPA
      # ---------------------------------------------------------
      - name: Verify IPA
        working-directory: artifacts/project-istiqamah
        run: |
          set -euo pipefail

          IPA="build/ProjectIstiqamah-unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "Unsigned IPA successfully created:"
          ls -lh "$IPA"

      # ---------------------------------------------------------
      # 14. Upload IPA to GitHub Actions
      # ---------------------------------------------------------
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-istiqamah-ios-unsigned
          path: artifacts/project-istiqamah/build/ProjectIstiqamah-unsigned.ipa
          if-no-files-found: error